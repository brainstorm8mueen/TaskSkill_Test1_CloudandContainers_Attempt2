server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/dev/ { proxy_pass http://backend-dev:3001/api/; proxy_set_header Host $host; }
  location /api/prod/ { proxy_pass http://backend-prod:3002/api/; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
  location = /health { access_log off; return 200 'healthy\n'; add_header Content-Type text/plain; }
}
